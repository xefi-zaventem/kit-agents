name: tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Kit à la version du projet (.kit-version)
        uses: actions/checkout@v4
        with: { repository: "<organisation>/kit-agents", ref: "<étiquette de .kit-version>", path: kit }
      - name: Tests d'acceptation, init.sh et liste inchangés (sauf « passes ») ; D28
        run: |
          BASE=refs/remotes/origin/main
          FUSION=""
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then BASE=HEAD~1; FUSION=--fusion-github; fi
          git diff --exit-code "$BASE" -- tests/acceptance/ init.sh
          if [ -z "$FUSION" ]; then
            git diff --exit-code "$BASE" -- .github/ ':(glob)**/conftest.py' pytest.ini tox.ini \
              setup.cfg pyproject.toml ':(glob)**/sitecustomize.py' ':(glob)**/usercustomize.py'
            test -z "$(git ls-files --others --exclude-standard -- .github/ ':(glob)**/conftest.py' \
              pytest.ini tox.ini setup.cfg pyproject.toml ':(glob)**/sitecustomize.py' \
              ':(glob)**/usercustomize.py')"
          fi
          python3 kit/bin/verifier-diff-liste "$BASE" feature_list.json
          python3 kit/bin/verifier-auteurs $FUSION "$BASE..$TETE" "$PILOTE_NOM" "$PILOTE_COURRIEL"
        env:
          TETE: ${{ github.event.pull_request.head.sha || github.sha }}
          PILOTE_NOM: ${{ vars.KIT_PILOTE_NOM }}
          PILOTE_COURRIEL: ${{ vars.KIT_PILOTE_COURRIEL }}
      - name: Tous les contrôles
        run: ./init.sh --ci && ./kit/bin/tout-verifier
